# Multi-host test swarm: one NATS server, one hub, one git server, and three
# hosts that run the fake harness with the process launcher. Timings are short
# so takeovers happen in seconds.
name: borant-e2e

x-image: &image
  image: borant:e2e
  build:
    context: ..
    dockerfile: docker/Dockerfile

x-timing: &timing
  BORANT_NATS_URL: nats://natshub:4222
  BORANT_LEASE_SECS: "6"
  BORANT_GRACE_SECS: "6"
  BORANT_HEARTBEAT_SECS: "2"
  BORANT_RESERVE_SECS: "30"
  BORANT_LOG: info,async_nats=warn

x-host: &host
  <<: *image
  command: ["borant", "host"]
  depends_on: [nats, git]

services:
  nats:
    image: nats:2.11
    command: ["-js", "-sd", "/data"]
    networks:
      default:
        aliases: [natshub]

  nats2:
    image: nats:2.11
    command: ["-js", "-sd", "/data"]
    profiles: [move]
    networks:
      default:
        aliases: [natshub]

  git:
    <<: *image
    command: ["sh", "/scripts/git-server.sh"]
    volumes:
      - ./git-server.sh:/scripts/git-server.sh:ro

  hub:
    <<: *image
    command: ["borant", "hub"]
    environment:
      <<: *timing
    depends_on: [nats]

  hub2:
    <<: *image
    command: ["sleep", "infinity"]
    profiles: [move]
    environment:
      <<: *timing

  # The hub of the elastic scenario. It starts the pool hosts of the
  # provision-docker plugin, so it needs the socket of the Docker daemon, the
  # plugin, and its hub.toml. The other scenarios run `hub`, unchanged.
  # E2E_ROOT is the path of the repository, set by tests/e2e/lib.sh: a
  # relative source path is resolved differently by compose versions, and a
  # source that does not exist becomes a directory.
  hub-elastic:
    <<: *image
    command: ["borant", "hub"]
    profiles: [elastic]
    environment:
      <<: *timing
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${E2E_ROOT:?set_by_tests_e2e_run_sh}/tests/e2e/plugins:/plugins:ro
      - ${E2E_ROOT:?set_by_tests_e2e_run_sh}/tests/e2e/elastic/hub.toml:/root/.borant/hub.toml:ro
    depends_on: [nats]

  # The static host of the elastic scenario. It runs the boss, and its
  # max_agents of 1 sends the spawns of the boss to the pool.
  host-control:
    <<: *host
    hostname: host-control
    profiles: [elastic]
    environment:
      <<: *timing
      BORANT_HOST_NAME: host-control
      BORANT_LAUNCHER: process
      BORANT_HARNESSES: fake
      BORANT_MAX_AGENTS: "1"

  host-a:
    <<: *host
    hostname: host-a
    environment:
      <<: *timing
      BORANT_HOST_NAME: host-a
      BORANT_LAUNCHER: process
      BORANT_HARNESSES: fake

  host-b:
    <<: *host
    hostname: host-b
    environment:
      <<: *timing
      BORANT_HOST_NAME: host-b
      BORANT_LAUNCHER: process
      BORANT_HARNESSES: fake

  host-c:
    <<: *host
    hostname: host-c
    environment:
      <<: *timing
      BORANT_HOST_NAME: host-c
      BORANT_LAUNCHER: process
      BORANT_HARNESSES: fake
