# Multi-host test swarm: one NATS server, one hub, one git server, and three
# hosts that run the fake harness with the process launcher. Timings are short
# so takeovers happen in seconds.
name: borant-e2e

x-image: &image
  image: borant:e2e
  build:
    context: ..
    dockerfile: docker/Dockerfile

x-timing: &timing
  BORANT_NATS_URL: nats://natshub:4222
  BORANT_LEASE_SECS: "6"
  BORANT_GRACE_SECS: "6"
  BORANT_HEARTBEAT_SECS: "2"
  BORANT_RESERVE_SECS: "30"
  BORANT_LOG: info,async_nats=warn

x-host: &host
  <<: *image
  command: ["borant", "host"]
  depends_on: [nats, git]

services:
  nats:
    image: nats:2.11
    command: ["-js", "-sd", "/data"]
    networks:
      default:
        aliases: [natshub]

  nats2:
    image: nats:2.11
    command: ["-js", "-sd", "/data"]
    profiles: [move]
    networks:
      default:
        aliases: [natshub]

  git:
    <<: *image
    command: ["sh", "/scripts/git-server.sh"]
    volumes:
      - ./git-server.sh:/scripts/git-server.sh:ro

  hub:
    <<: *image
    command: ["borant", "hub"]
    environment:
      <<: *timing
    depends_on: [nats]

  hub2:
    <<: *image
    command: ["sleep", "infinity"]
    profiles: [move]
    environment:
      <<: *timing

  # The hub of the elastic scenario. It starts the pool hosts of the
  # provision-docker plugin, so it needs the socket of the Docker daemon, the
  # plugin, and its hub.toml. The other scenarios run `hub`, unchanged.
  # E2E_ROOT is the path of the repository, set by tests/e2e/lib.sh: a
  # relative source path is resolved differently by compose versions, and a
  # source that does not exist becomes a directory.
  hub-elastic:
    <<: *image
    command: ["borant", "hub"]
    profiles: [elastic]
    environment:
      <<: *timing
      # The elastic pass and the stderr of the provisioner plugin are debug
      # lines: the scenario prints them when it fails.
      BORANT_LOG: "debug,async_nats=warn"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${E2E_ROOT:?set_by_tests_e2e_run_sh}/tests/e2e/plugins:/plugins:ro
      - ${E2E_ROOT:?set_by_tests_e2e_run_sh}/tests/e2e/elastic/hub.toml:/root/.borant/hub.toml:ro
    depends_on: [nats]

  # The static host of the elastic scenario. It runs the boss, and its
  # max_agents of 1 sends the spawns of the boss to the pool.
  host-control:
    <<: *host
    hostname: host-control
    profiles: [elastic]
    environment:
      <<: *timing
      BORANT_HOST_NAME: host-control
      BORANT_LAUNCHER: process
      BORANT_HARNESSES: fake
      BORANT_MAX_AGENTS: "1"

  # The one host of the members scenario, with the fake-auth bundle of three
  # members. `[secrets]` comes from the mounted host.toml; the values are
  # fakes in the environment of the container. E2E_ROOT is the path of the
  # repository, set by tests/e2e/lib.sh.
  host-members:
    <<: *host
    hostname: host-members
    profiles: [members]
    environment:
      <<: *timing
      BORANT_HOST_NAME: host-members
      BORANT_LAUNCHER: process
      BORANT_HARNESSES: fake
      BORANT_MAX_AGENTS: "5"
      FAKE_AUTH_TOKEN_A: fake-a-token-not-a-secret
      FAKE_AUTH_TOKEN_B: fake-b-token-not-a-secret
      FAKE_AUTH_TOKEN_C: fake-c-token-not-a-secret
    volumes:
      - ${E2E_ROOT:?set_by_tests_e2e_run_sh}/docker/members/host.toml:/root/.borant/host.toml:ro

  host-a:
    <<: *host
    hostname: host-a
    environment:
      <<: *timing
      BORANT_HOST_NAME: host-a
      BORANT_LAUNCHER: process
      BORANT_HARNESSES: fake

  # The sandbox scenario of phase 5 runs alone, like elastic: its hub carries a
  # role that asks for a namespace sandbox, and only host-sandbox offers one.
  # host-a is a host without [sandbox], so a sandboxed spawn is refused there.
  hub-sandbox:
    <<: *image
    command: ["borant", "hub"]
    profiles: [sandbox]
    environment:
      <<: *timing
    volumes:
      - ${E2E_ROOT:?set_by_tests_e2e_run_sh}/tests/e2e/sandbox/hub.toml:/root/.borant/hub.toml:ro
    depends_on: [nats, git]

  host-sandbox:
    <<: *host
    hostname: host-sandbox
    profiles: [sandbox]
    environment:
      <<: *timing
      BORANT_HOST_NAME: host-sandbox
      BORANT_LAUNCHER: process
      BORANT_HARNESSES: fake
      BORANT_MAX_AGENTS: "2"
    volumes:
      - ${E2E_ROOT:?set_by_tests_e2e_run_sh}/tests/e2e/sandbox/host.toml:/root/.borant/host.toml:ro
    # bubblewrap makes a user namespace. Docker's default seccomp profile
    # refuses the clone, and an Ubuntu 24.04 host refuses an unprivileged user
    # namespace to a process confined by AppArmor; the kernel's
    # apparmor_restrict_unprivileged_userns lifts that only for a process with
    # CAP_SYS_ADMIN. This one test container gets both options and the
    # capability; nothing else in the swarm does.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    cap_add:
      - SYS_ADMIN

  host-b:
    <<: *host
    hostname: host-b
    environment:
      <<: *timing
      BORANT_HOST_NAME: host-b
      BORANT_LAUNCHER: process
      BORANT_HARNESSES: fake

  host-c:
    <<: *host
    hostname: host-c
    environment:
      <<: *timing
      BORANT_HOST_NAME: host-c
      BORANT_LAUNCHER: process
      BORANT_HARNESSES: fake

  # The one-slot host of the queue scenario, which starts it on demand: one
  # slot makes a forced spawn queue. It has no profile, so no swarm starts it.
  host-q:
    <<: *host
    hostname: host-q
    environment:
      <<: *timing
      BORANT_HOST_NAME: host-q
      BORANT_LAUNCHER: process
      BORANT_HARNESSES: fake
      BORANT_MAX_AGENTS: "1"
