[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.13.1"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
borant-core = { path = "crates/borant-core" }
borant-exec = { path = "crates/borant-exec" }
borant-memory = { path = "crates/borant-memory" }
borant-nats = { path = "crates/borant-nats" }
borant-hub = { path = "crates/borant-hub" }
borant-host = { path = "crates/borant-host" }
borant-launch = { path = "crates/borant-launch" }
borant-secrets = { path = "crates/borant-secrets" }

anyhow = "1.0.104"
async-nats = "0.50.0"
async-trait = "0.1.92"
axum = "0.8.9"
bytes = { version = "1.12.1", features = ["serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
croner = { version = "4.0.2", features = ["chrono"] }
dirs = "7.0.0"
futures = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
jsonschema = { version = "0.60.1", default-features = false }
ratatui = "0.30.2"
regex = "1.13.1"
rmcp = "3.7.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = { version = "3.0.0", features = ["serde"] }
zeroize = "1.8.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
